services:
  openclaw:
    build: .
    image: openclaw:latest
    container_name: openclaw-gateway
    restart: unless-stopped
    # Add capabilities needed for VPN
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    devices:
      - /dev/net/tun
    ports:
      - "18789:18789"
    volumes:
      # Persistent data storage
      - ./data/openclaw:/data/openclaw
      - ./data/config:/data/config
    environment:
      # Node environment
      - NODE_ENV=production
      
      # OpenClaw configuration paths
      - OPENCLAW_HOME=/data/openclaw
      - OPENCLAW_CONFIG=/data/config
      
      # Optional: Set timezone (adjust as needed)
      - TZ=UTC
      
      # Optional: Set log level (debug, info, warn, error)
      - LOG_LEVEL=info
      
      # Optional: API Keys (can be set via Synology environment variables)
      # - ANTHROPIC_API_KEY=your_key_here
      # - OPENAI_API_KEY=your_key_here
      
      # VPN Configuration (Surfshark)
      # Enable VPN by setting VPN_ENABLED to true
      - VPN_ENABLED=false
      # VPN type: openvpn or wireguard
      - VPN_TYPE=openvpn
      # Surfshark service credentials (not your account login!)
      # Get these from: https://my.surfshark.com/vpn/manual-setup/main
      # - SURFSHARK_USER=your_service_username
      # - SURFSHARK_PASSWORD=your_service_password
      # Surfshark country code (e.g., us, uk, de, jp)
      # - SURFSHARK_COUNTRY=us
      # Require VPN to be connected (fail if VPN fails)
      - VPN_REQUIRED=false
    
    # Optional: Memory limits (adjust based on Synology NAS resources)
    mem_limit: 2g
    mem_reservation: 512m
    
    # Optional: CPU limits
    cpus: "2.0"
    
    # Network mode
    network_mode: bridge
    
    # Labels for organization
    labels:
      - "com.synology.app=openclaw"
      - "com.synology.description=OpenClaw Personal AI Assistant"
      - "com.synology.maintainer=openclaw-docker"
